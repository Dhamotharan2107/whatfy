version: '3.8'

services:
  # Existing Whatfy App
  whatfy-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=sqlite:///platform.db
      - GO_SERVER_URL=http://localhost:8080
    volumes:
      - ./platform.db:/app/platform.db
      - ./whatsmeow_server:/app/whatsmeow_server
    depends_on:
      - mcp-server
    restart: unless-stopped

  # MCP WhatsApp Server
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "8001:8001"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
      - RATE_LIMIT_WINDOW=60
      - RATE_LIMIT_REQUESTS=10
      - RATE_LIMIT_BURST=3
    volumes:
      - ./mcp_env.example:/app/.env:ro
    depends_on:
      - whatfy-app
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - whatfy-app
      - mcp-server
    restart: unless-stopped

networks:
  default:
    name: whatfy-network
